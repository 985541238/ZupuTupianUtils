# 测试服务器部署编排（应用单容器 + 共享 MySQL）
#
#   1) 建库：把 deploy/docker/mysql/init-mysql8.sql 导入共享 MySQL 8.0
#   2) cp deploy/docker/.env.test.example .env 并按实际值填写（DB_PASS 等）
#   3) docker compose -f deploy/docker/docker-compose.test.yml pull
#      docker compose -f deploy/docker/docker-compose.test.yml up -d
#
# 说明：
#   - 数据库不在本编排内起，由部署侧提供（共享 MySQL 8.0）
#   - 容器内监听 8080，宿主机映射到 8080，由 nginx 反代到子域名
#   - 上传原图与处理结果落在 ./data，容器重建不丢

name: zupu-scan

services:
  app:
    image: ${IMAGE:-ccr.ccs.tencentyun.com/100000659505/zupu-scan:v1.0.0}
    container_name: zupu-app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-zupu_scan}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      SETTINGS_SECRET: ${SETTINGS_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      AI_MOCK: ${AI_MOCK:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
