<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scanwash · 族谱扫描页清洗</title>
<style>
  :root { --line:#e2e5ea; --ink:#1f2329; --sub:#6b7280; --accent:#b42318; --bg:#f7f8fa; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:860px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  select,button { font-size:14px; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #drop { border:1.5px dashed #c9cdd4; border-radius:8px; padding:36px; text-align:center; color:var(--sub); margin-bottom:14px; }
  #drop.over { border-color:var(--ink); color:var(--ink); }
  img.result { max-width:100%; border:1px solid var(--line); border-radius:6px; margin-top:14px; }
  table.meta { border-collapse:collapse; font-size:13px; margin-top:14px; width:100%; }
  table.meta td, table.meta th { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  table.meta th { background:#fafbfc; font-weight:600; width:110px; }
  .warn { color:var(--accent); font-weight:600; }
  .ok { color:#067647; font-weight:600; }
  #status { font-size:13px; color:var(--sub); }
  a.btn { font-size:13px; color:var(--ink); text-decoration:none; border:1px solid var(--line); padding:7px 12px; border-radius:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>scanwash · 族谱扫描页清洗</h1>
  <div class="sub">白纸黑字，保留笔画，不重画字形 — v1.0.0</div>
  <div class="card">
    <div id="drop">拖拽图片到这里，或 <button type="button" onclick="document.getElementById('file').click()">选择文件</button>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <div class="row">
      <label>分档
        <select id="preset">
          <option value="auto">auto（自动）</option>
          <option value="clean">clean（干净）</option>
          <option value="aged">aged（老化）</option>
          <option value="damaged">damaged（残页）</option>
        </select>
      </label>
      <button class="primary" id="go" disabled>开始清洗</button>
      <span id="status"></span>
      <a class="btn" id="dl" style="display:none" download="scanwash.png">下载 PNG</a>
    </div>
    <div id="result"></div>
  </div>
</div>
<script>
var $ = function (id) { return document.getElementById(id); };
var picked = null;
var drop = $('drop');
drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = function () { drop.classList.remove('over'); };
drop.ondrop = function (e) {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
};
$('file').onchange = function (e) { setFile(e.target.files[0]); };
function setFile(f) {
  if (!f) return;
  picked = f;
  $('status').textContent = '已选择：' + f.name;
  $('go').disabled = false;
}
$('go').onclick = async function () {
  if (!picked) return;
  $('go').disabled = true;
  $('status').textContent = '清洗中…';
  $('result').innerHTML = '';
  $('dl').style.display = 'none';
  var fd = new FormData();
  fd.append('file', picked);
  fd.append('preset', $('preset').value);
  try {
    var r = await fetch('/api/clean', { method: 'POST', body: fd });
    if (!r.ok) {
      var t = await r.text();
      throw new Error(t || ('HTTP ' + r.status));
    }
    var blob = await r.blob();
    var url = URL.createObjectURL(blob);
    var meta = JSON.parse(r.headers.get('X-Scanwash-Meta') || '{}');
    $('dl').href = url;
    $('dl').style.display = '';
    var rows = [
      ['分档', meta.tier || '-'],
      ['耗时', (meta.ms == null ? '-' : meta.ms + ' ms')],
      ['纠偏', (meta.angle_deg == null ? 0 : meta.angle_deg) + ' °'],
      ['墨色 p50', meta.ink_p50 == null ? '-' : meta.ink_p50],
      ['纸色 p50', meta.paper_p50 == null ? '-' : meta.paper_p50],
      ['掩膜占比', meta.mask_ratio == null ? '-' : meta.mask_ratio],
      ['输入尺寸', (meta.size_in || []).join(' × ')],
      ['输出尺寸', (meta.size_out || []).join(' × ')],
      ['书缝阴影', meta.gutter ? '是' : '否'],
      ['状态', meta.review ? '<span class="warn">需人工复核</span>' : '<span class="ok">通过</span>'],
      ['警告', (meta.warnings && meta.warnings.length) ? '<span class="warn">' + meta.warnings.join(', ') + '</span>' : '无']
    ];
    var html = '<img class="result" src="' + url + '"><table class="meta">';
    rows.forEach(function (kv) { html += '<tr><th>' + kv[0] + '</th><td>' + kv[1] + '</td></tr>'; });
    html += '</table>';
    $('result').innerHTML = html;
    $('status').textContent = '完成';
  } catch (e) {
    $('status').textContent = '失败：' + e.message;
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
