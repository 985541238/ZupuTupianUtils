<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>设置服务器地址</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f7;font-family:-apple-system,"Microsoft YaHei",sans-serif;color:#1d1d1f}
.c{width:440px;background:#fff;border-radius:24px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
h1{font-size:20px;margin:0 0 6px}p{font-size:13px;color:#86868b;margin:0 0 22px;line-height:1.6}
input{width:100%;box-sizing:border-box;height:44px;border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:0 14px;font-size:14px;outline:none}
input:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.15)}
button{margin-top:16px;width:100%;height:44px;border:0;border-radius:12px;background:#0071e3;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.e{color:#d70015;font-size:12px;margin-top:10px;min-height:16px}
</style></head><body><div class="c">
<h1>族谱清晰化工作台</h1><p>请输入服务器地址（部署后的访问地址），之后会自动记住。</p>
<input id="u" placeholder="例如 http://192.168.1.10:8081 或 https://zupu.example.com" autofocus>
<div class="e" id="e"></div><button id="b">保存并进入</button></div>
<script>
const u=document.getElementById('u'),e=document.getElementById('e');
zupu.get().then(c=>{u.value=c.serverUrl||''});
async function go(){const r=await zupu.save(u.value);if(!r.ok)e.textContent=r.error}
document.getElementById('b').onclick=go;u.onkeydown=ev=>{if(ev.key==='Enter')go()};
</script></body></html>
