<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>无法连接</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f7;font-family:-apple-system,"Microsoft YaHei",sans-serif;color:#1d1d1f}
.c{width:460px;background:#fff;border-radius:24px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
h1{font-size:19px;margin:0 0 8px}p{font-size:13px;color:#6e6e73;line-height:1.7;margin:0 0 6px;word-break:break-all}
.r{display:flex;gap:10px;margin-top:22px}button{flex:1;height:42px;border:0;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.p{background:#0071e3;color:#fff}.s{background:#f0f0f3;color:#1d1d1f}
</style></head><body><div class="c"><h1>无法连接到服务器</h1>
<p id="u"></p><p id="d" style="color:#d70015"></p>
<p>请确认服务器已启动、地址和端口正确、本机网络能访问它。</p>
<div class="r"><button class="p" onclick="zupu.retry()">重试</button><button class="s" onclick="zupu.setup()">修改地址</button></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('u').textContent='地址：'+(q.get('url')||'');document.getElementById('d').textContent=q.get('desc')||''</script>
</body></html>
